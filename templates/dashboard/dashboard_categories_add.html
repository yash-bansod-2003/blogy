{% extends "dashboard/sidebar.html" %}

{% load crispy_forms_tags %}

{% block dashboard_content %}
    <div class="col-md-9">
        <h1>Add New Category</h1>
        <p>Fill in the form below to add a new category.</p>

        <div>
            <form action="{% url 'dashboard_categories_add' %}" method="post">
                {% csrf_token %}
                {{ form | crispy }}
                <button class="btn btn-primary" type="submit">Add Category</button>
            </form>
         </div>
    </div>
{% endblock %}
